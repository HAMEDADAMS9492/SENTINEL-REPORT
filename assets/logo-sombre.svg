<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Fond Anthracite Sombre et Neutre -->
  <rect width="800" height="500" fill="#0F172A" rx="12"/>

  <defs>
    <!-- Dégradé Acier / Ardoise Subtil pour le Bouclier -->
    <linearGradient id="shieldGradSober" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- ACCENT OPTION A : Bleu Acier / Sécurité -->
    <!-- Pour passer à l'OPTION B (Ambre), remplacez #0EA5E9 par #F59E0B et #0284C7 par #D97706 -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Groupe Icône Centré -->
  <g transform="translate(400, 180)">
    
    <!-- 1. Bouclier Extérieur (Acier Mat) -->
    <path d="M 0 -95 L 35 -95 L 70 -60 L 70 15 C 70 60, 40 85, 0 100 C -40 85, -70 60, -70 15 L -70 -60 L -35 -95 Z" 
          fill="none" 
          stroke="url(#shieldGradSober)" 
          stroke-width="4.5" 
          stroke-linejoin="round"/>

    <!-- 2. Armature Intérieure Discrète (Tirée vers le gris ardoise) -->
    <path d="M 0 -83 L 28 -83 L 58 -53 L 58 12 C 58 48, 32 70, 0 83 C -32 70, -58 48, -58 12 L -58 -53 L -28 -83 Z" 
          fill="none" 
          stroke="#334155" 
          stroke-width="1.8" 
          stroke-dasharray="10 5" 
          opacity="0.8"/>

    <!-- 3. Ancrages Tactiques Subtils -->
    <circle cx="70" cy="-60" r="2.5" fill="#64748B"/>
    <circle cx="-70" cy="-60" r="2.5" fill="#64748B"/>
    <path d="M 0 -95 L 0 -85" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 90 L 0 100" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

    <!-- 4. Contour de l'Œil / Lentille (Haute Clarté, Blanc Neutre) -->
    <path d="M -38 0 C -20 -24, 20 -24, 38 0" 
          fill="none" 
          stroke="#F8FAFC" 
          stroke-width="3.5" 
          stroke-linecap="round"/>

    <path d="M -38 0 C -20 24, 20 24, 38 0" 
          fill="none" 
          stroke="#F8FAFC" 
          stroke-width="3.5" 
          stroke-linecap="round"/>

    <!-- 5. Réticule de Détection (Focalisation discrète) -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#0EA5E9" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- 6. Pupille Centrale (Point d'Accent Unique) -->
    <circle cx="0" cy="0" r="7" fill="url(#accentGlow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#0F172A"/>
  </g>

  <!-- Typographie Épurée -->
  <text x="400" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#F8FAFC" text-anchor="middle" letter-spacing="8">
    SENTINEL
  </text>
  
  <text x="400" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="10">
    REPORT
  </text>
  
  <text x="400" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="4">
    COMPUTER VISION SECURITY SYSTEM
  </text>
</svg>
