<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Fond Transparent -->

  <g transform="translate(400, 180)">
    <!-- Bouclier Extérieur -->
    <path d="M 0 -95 L 35 -95 L 70 -60 L 70 15 C 70 60, 40 85, 0 100 C -40 85, -70 60, -70 15 L -70 -60 L -35 -95 Z" 
          fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Armature Intérieure -->
    <path d="M 0 -83 L 28 -83 L 58 -53 L 58 12 C 58 48, 32 70, 0 83 C -32 70, -58 48, -58 12 L -58 -53 L -28 -83 Z" 
          fill="none" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>

    <!-- Ancrages Tactiques -->
    <circle cx="70" cy="-60" r="2.5" fill="#0F172A"/>
    <circle cx="-70" cy="-60" r="2.5" fill="#0F172A"/>

    <!-- Contour Œil -->
    <path d="M -38 0 C -20 -24, 20 -24, 38 0" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -38 0 C -20 24, 20 24, 38 0" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Réticule & Pupille -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#0F172A" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>
    <circle cx="0" cy="0" r="7" fill="#0F172A"/>
  </g>

  <!-- Typographie -->
  <text x="400" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#0F172A" text-anchor="middle" letter-spacing="8">
    SENTINEL
  </text>
  
  <text x="400" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#0F172A" text-anchor="middle" letter-spacing="10" opacity="0.8">
    REPORT
  </text>
  
  <text x="400" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="10" fill="#0F172A" text-anchor="middle" letter-spacing="4" opacity="0.6">
    COMPUTER VISION SECURITY SYSTEM
  </text>
</svg>
